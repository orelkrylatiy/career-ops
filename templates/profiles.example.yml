# profiles.yml — multi-account registry (user layer, gitignored).
#
# A PROFILE is one person's account. It maps Telegram user ids to the stats
# the bot shows them: several people → several profiles, each sees only their
# own numbers (an entry with admin: true sees every profile).
#
# A DIRECTION is a specialization inside a profile — analyst, designer,
# react, vue, … as many as you like. Each direction runs fully isolated:
#   data/profiles/<profile>/<direction>/   ← its own career-ops data root
#   (own tracker, reports/, scan history, autopilot.db, config/, cv.md)
#   plus its own browser profile and Playwright session.
#
# Prefer the CLI over hand-editing — it creates the direction skeleton too:
#   node profile.mjs add-profile maxim --name Maxim --tg 123456789 --admin
#   node profile.mjs add-direction maxim analyst --name "Data Analyst"
#   node profile.mjs env maxim analyst        # exports for this direction
#   node profile.mjs launch maxim analyst     # its isolated browser
#
# Telegram user ids: write to @userinfobot in Telegram, it replies with yours.
profiles: []
# Example of a filled-in registry:
# profiles:
#   - id: maxim
#     name: Maxim
#     telegram:
#       - user_id: "123456789"
#         name: Maxim
#         admin: true
#     directions:
#       - { id: analyst,  name: Data Analyst,    created: "2026-09-23" }
#       - { id: designer, name: Designer,        created: "2026-09-23" }
#       - { id: react,    name: React Developer, created: "2026-09-24" }
#   - id: ivan
#     name: Ivan
#     telegram:
#       - user_id: "987654321"
#         name: Ivan
#     directions:
#       - { id: vue, name: Vue Developer, created: "2026-09-25" }
