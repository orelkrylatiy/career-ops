name: Regional source registry

on:
  push:
    branches: [main]
    paths:
      - "autopilot*.mjs"
      - "scan-regional.mjs"
      - "source-registry.mjs"
      - "catalog/**"
      - "providers/trudvsem.mjs"
      - "providers/staffam.mjs"
      - "providers/careercenter-am.mjs"
      - "providers/ishuz.mjs"
      - "tests/source-registry.test.mjs"
      - "tests/providers/regional-cis.test.mjs"
      - "package.json"
      - ".github/workflows/regional-sources.yml"
  pull_request:
    paths:
      - "autopilot*.mjs"
      - "scan-regional.mjs"
      - "source-registry.mjs"
      - "catalog/**"
      - "providers/trudvsem.mjs"
      - "providers/staffam.mjs"
      - "providers/careercenter-am.mjs"
      - "providers/ishuz.mjs"
      - "tests/source-registry.test.mjs"
      - "tests/providers/regional-cis.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax gate
        run: node scripts/check-syntax.mjs
      - name: Regional parser tests
        run: node --test tests/source-registry.test.mjs tests/providers/regional-cis.test.mjs
