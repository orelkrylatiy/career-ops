name: Fork release policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain fork release policy
        run: |
          echo "This autonomous fork is installed directly from GitHub."
          echo "The upstream @santifer/career-ops npm package is not published by this fork."
          echo "Create an explicit fork release workflow only if/when a separate package/release channel is needed."
