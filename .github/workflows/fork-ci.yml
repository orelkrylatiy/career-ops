name: Fork CI

on:
  push:
    branches:
      - main
      - migration/upstream-1.33-autopilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-and-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: node test-all.mjs --quick
      - name: Playwright CLI exposure
        run: node autopilot-verify.mjs doctor
      - name: Fork-focused tests
        run: node --test tests/source-registry.test.mjs tests/providers/regional-cis.test.mjs tests/autopilot-resume.test.mjs tests/autopilot-log.test.mjs tests/autopilot-db-metadata.test.mjs tests/autopilot-db-migration.test.mjs tests/autopilot-wide-queue.test.mjs tests/autopilot-ranking.test.mjs tests/autopilot-url-policy.test.mjs tests/autopilot-verifier.test.mjs tests/autopilot-discovery-contract.test.mjs tests/autopilot-report-contract.test.mjs tests/autopilot-tracker-dedup.test.mjs tests/autopilot-doc-contract.test.mjs tests/autopilot-legacy-tombstones.test.mjs tests/readme-english-only.test.mjs
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Real Playwright CLI submit smoke
        run: node tests/autopilot-browser-e2e.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
