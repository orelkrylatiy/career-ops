name: Autonomous CareerOps integration

on:
  push:
    branches: ['rebuild/upstream-2026-11-21', 'sync/upstream-*', 'main']
  pull_request:
    paths:
      - 'autopilot*'
      - 'captcha-solver.mjs'
      - 'modes/autopilot.md'
      - 'tests/autopilot*'
      - 'tests/captcha-solver.test.mjs'
      - 'package.json'
      - '.github/workflows/autopilot-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install without starting real browsers
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check autopilot-scan.mjs
          node --check profile.mjs
          node --check source-registry.mjs
          node --check providers/habr-career.mjs
          node --check providers/geekjob.mjs
          node --check providers/superjob.mjs
          node --check autopilot-runner.mjs
          node --check autopilot-mail.mjs
          node --check autopilot-diagnostics.mjs
          node --check autopilot.mjs
          node --check autopilot-verify.mjs
          node --check captcha-solver.mjs
      - name: Test autonomous contracts (no real submissions)
        run: npm run autopilot:test
      - name: Validate original Career Ops source syntax
        run: npm run lint
      - name: Run upstream quick compatibility suite
        run: node test-all.mjs --quick

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Local fixture only (no external application)
        run: node tests/autopilot-browser-e2e.mjs
